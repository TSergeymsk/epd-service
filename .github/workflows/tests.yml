name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Install core Python deps
        # Ставим по отдельности, чтобы отсутствие optional-зависимости
        # (gigachat) не блокировало установку обязательных (flask/requests/pyyaml).
        run: |
          python -m pip install --upgrade pip
          pip install flask requests pyyaml beautifulsoup4 markdown

      - name: Install optional gigachat (не критично для тестов)
        # Тесты мокают gigachat через sys.modules, поэтому падение
        # установки не должно ломать прогон.
        run: |
          pip install gigachat || echo "::warning::gigachat install failed; tests will use mocks"
        continue-on-error: true

      - name: Install dev deps
        run: |
          pip install pytest pytest-cov pytest-mock

      - name: Show environment
        run: |
          python --version
          pip list

      - name: Verify imports
        # Раньше всего выявляет «нет зависимостей» — падает с понятным сообщением
        run: |
          python -c "import flask, requests, yaml; print('core deps OK')"

      - name: Run tests
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=xml -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7