name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core deps (обязательные)
        run: |
          python -m pip install --upgrade pip
          pip install flask requests pyyaml beautifulsoup4 markdown

      - name: Install dev deps
        run: |
          pip install pytest pytest-cov pytest-mock

      - name: Install optional gigachat (не критично)
        run: |
          pip install gigachat || echo "::warning::gigachat install failed; tests use mocks"
        continue-on-error: true

      - name: Verify imports (ранняя диагностика)
        run: |
          python -c "import flask, requests, yaml; print('core deps OK')"

      - name: Pytest collect-only (проверка сбора)
        run: |
          pytest --collect-only -q

      - name: Run tests
        run: |
          pytest --cov=. --cov-report=term-missing --cov-report=xml -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7