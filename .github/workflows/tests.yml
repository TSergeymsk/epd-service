name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install flask requests pyyaml beautifulsoup4 markdown

      - name: Install dev deps
        run: |
          pip install pytest pytest-cov pytest-mock

      - name: Install optional gigachat (не критично)
        run: |
          pip install gigachat || echo "::warning::gigachat install failed; tests use mocks"
        continue-on-error: true

      - name: Diagnostics
        run: |
          python --version
          pip show flask requests pyyaml pytest pytest-cov pytest-mock | grep -E "^(Name|Version):"
          echo "--- pytest.ini ---"
          cat pytest.ini || echo "no pytest.ini"
          echo "--- pyproject.toml (если есть) ---"
          cat pyproject.toml 2>/dev/null || echo "no pyproject.toml"
          echo "--- tests/ ---"
          ls -la tests/

      - name: Verify imports
        run: python -c "import flask, requests, yaml; print('core deps OK')"

      - name: Pytest collect-only
        id: collect
        run: pytest --collect-only -v 2>&1 | tee collect.log
        continue-on-error: true

      - name: Run tests
        id: pytest
        run: pytest --cov=. --cov-report=term-missing --cov-report=xml -v 2>&1 | tee pytest.log
        continue-on-error: true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-py${{ matrix.python-version }}
          path: |
            collect.log
            pytest.log
            coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if tests failed
        if: steps.pytest.outcome == 'failure' || steps.collect.outcome == 'failure'
        run: |
          echo "::error::Tests failed. Скачайте артефакт logs-py${{ matrix.python-version }} и пришлите collect.log/pytest.log."
          exit 1