ai:
  provider: groq
  model: openai/gpt-oss-20b
  url: https://api.groq.com/openai/v1/chat/completions
  timeout: 120
  temperature: 0.7
  max_tokens: 2000

prompts:
  analysis: |
    Ты аналитик ЖКХ. Проведи анализ ЕПД для адреса: {address} за период {period}.

    Данные за текущий месяц (агрегированы по всем лицевым счетам):
    {current_data}

    {prev_data}

    Динамика за последние 12 месяцев (доступно {months_count} месяцев):
    {dynamics}

    Не перечисляй все услуги и их суммы в ответе – они уже есть в шапке сообщения.
    Сосредоточься на:
    1. Анализе структуры расходов: какие услуги составляют основную долю, есть ли аномалии (нулевые начисления, резкие изменения).
    2. Сравнении с предыдущим месяцем: какие изменения произошли, их причины (рост/снижение тарифов, потребления, появление/исчезновение услуг).
    3. Динамике за последние 12 месяцев: тренды (рост/снижение по основным услугам), сезонность, структурные сдвиги (если видны).
    Ответ должен быть кратким (не более 2000 символов), информативным, без таблиц и списков всех услуг. Используй простой текст без Markdown.
