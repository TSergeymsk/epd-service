# ruff.toml
target-version = "py311"
line-length = 110

extend-exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "logs",
    "build",
    "dist",
    ".pytest_cache",
    "migrations",
]

[lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",
]

[lint.per-file-ignores]
"getmail_filter.py" = ["E", "F", "W", "I"]
"frontend.py" = ["EXE001"]
"tests/*" = ["E", "F", "W", "I", "S101"]